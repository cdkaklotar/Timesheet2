<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Time Sheet</title><style>
:root{--b:#2563eb;--line:#dce3ee;--mut:#667085;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#14213d}.wrap{max-width:1750px;margin:auto;padding:18px}.top,.nav,.summary{display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{margin:0}.buttons{display:flex;gap:7px;flex-wrap:wrap}button,select,input{font:inherit}.btn{height:38px;padding:0 12px;border:1px solid var(--line);background:white;border-radius:7px;cursor:pointer}.primary{background:var(--b);color:white;border-color:var(--b)}.card{background:white;border:1px solid var(--line);border-radius:10px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:12px;margin:14px 0}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;font-weight:700}.field select,.field input{height:38px;border:1px solid var(--line);border-radius:6px;padding:0 9px}.type-field{position:relative}.typepanel{display:none;position:absolute;z-index:30;top:61px;left:0;width:270px;background:white;border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 8px 24px #0002}.typepanel.open{display:block}.typepanel label{display:flex;gap:7px;padding:6px}.nav{padding:5px 0 12px}.nav h2{margin:0}.tablebox{overflow:auto}.ts{width:100%;border-collapse:collapse;min-width:1350px}.ts th,.ts td{border:1px solid var(--line);padding:6px;text-align:center}.ts th{background:#eef2f7;font-size:12px}.ts input,.ts select{width:100%;padding:6px;border:1px solid #cad3df;border-radius:5px}.prod{background:#edf9ef}.unprod{background:#fff8df}.leave{background:#fff0f0}.week td{background:#eef5ff}.summary{padding:15px;margin-top:14px;flex-wrap:wrap}.metric{min-width:145px}.metric small{display:block;color:var(--mut)}.metric strong{font-size:22px}.mobileCal,.editor{display:none}.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead div{text-align:center;font-size:11px;font-weight:bold;color:var(--mut)}.day{min-height:58px;border:1px solid var(--line);border-radius:8px;background:white;padding:5px;text-align:left}.day.blank{visibility:hidden}.day.week{background:#eef5ff}.day.holiday{background:#fff0f0}.day .dot{display:block;width:7px;height:7px;background:var(--b);border-radius:50%;margin-top:5px}.editor{padding:12px;margin-top:10px}.editor h3{margin:0 0 10px}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ef{display:flex;flex-direction:column;gap:4px}.ef.full{grid-column:1/-1}.ef label{font-size:12px;font-weight:bold}.ef input,.ef select,.totalbox{height:42px;border:1px solid #cad3df;border-radius:6px;padding:8px;font-size:16px}.totalbox{background:#f2f4f7;font-weight:bold}
@media(max-width:700px){.wrap{padding:9px}.top{align-items:flex-start;flex-direction:column}.buttons{display:grid;grid-template-columns:1fr 1fr;width:100%}.buttons .btn{width:100%}.toolbar{display:grid;grid-template-columns:1fr 1fr;align-items:end}.toolbar .field{width:100%}.toolbar .field:last-of-type{grid-column:1/-1}.typepanel{position:static;width:100%;margin-top:3px}.nav h2{font-size:17px}.tablebox{display:none}.mobileCal{display:block;padding:9px}.editor.open{display:block}.summary{display:grid;grid-template-columns:1fr 1fr}.summary>strong{grid-column:1/-1}.metric{min-width:0}.editgrid{grid-template-columns:1fr 1fr}}@media(max-width:390px){.buttons,.toolbar,.summary,.editgrid{grid-template-columns:1fr}.toolbar .field:last-of-type,.summary>strong,.ef.full{grid-column:auto}}
</style></head><body><div class="wrap"><div class="top"><div><h1>My Time Sheet</h1><div style="color:var(--mut)">Monthly time tracking</div></div><div class="buttons"><button class="btn" id="import">Import Config</button><input hidden type="file" id="file" accept=".json"><button class="btn" id="backup">Export Config</button><button class="btn primary" id="csv">Export CSV</button></div></div><div class="toolbar card"><div class="field"><label>Month</label><select id="month"></select></div><div class="field"><label>Show</label><select id="show"><option value="all">All dates</option><option value="entered">With entry</option><option value="missing">Missing entry</option></select></div><div class="field type-field"><label>Day type filter</label><button class="btn" id="typebtn">All day types ▾</button><div class="typepanel" id="types"></div></div><div class="field"><label>Search</label><input id="search" placeholder="Date, day or note"></div><button class="btn" id="reset">Reset filters</button></div><div class="nav"><button class="btn" id="prev">◀ Previous</button><h2 id="title"></h2><button class="btn" id="next">Next ▶</button></div><div class="tablebox card"><table class="ts"><thead><tr><th>Date</th><th>Day</th><th>In</th><th>Out</th><th>Break min</th><th>Total h</th><th>Productive</th><th>Unproductive</th><th>Leave/Holiday</th><th>Day Type</th><th>Note</th></tr></thead><tbody id="body"></tbody></table></div><div class="mobileCal card" id="cal"></div><div class="editor card" id="editor"></div><div class="summary card"><strong>Monthly Total</strong><div class="metric"><small>Total Time</small><strong id="st">0.00 h</strong></div><div class="metric"><small>Productive</small><strong id="sp">0.00 h</strong></div><div class="metric"><small>Unproductive</small><strong id="su">0.00 h</strong></div><div class="metric"><small>Leave/Holiday</small><strong id="sl">0.00 h</strong></div></div></div><script>
(()=>{const TYPES=['Working Day','Working Day + Holiday','Working Day + Leave','Non-Working Day','Weekend','Weekend + Holiday','Leave','Holiday'],START=new Date(2026,8,1),$=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;let cur=new Date(START),data={};try{data=JSON.parse(localStorage.getItem('monthlyTimesheet-v1')||'{}')}catch{}function save(){localStorage.setItem('monthlyTimesheet-v1',JSON.stringify(data))}function def(d){return[0,6].includes(d.getDay())?'Weekend':'Working Day'}function rec(d){let k=iso(d);return data[k]||(data[k]={in:'',out:'',break:'',prod:'',unprod:'',leave:'',type:def(d),note:''})}function hrs(a,b,br){if(!a||!b)return 0;let A=a.split(':').map(Number),B=b.split(':').map(Number),m=B[0]*60+B[1]-A[0]*60-A[1];if(m<0)m+=1440;return Math.max(0,(m-(+br||0))/60)}function mname(d){return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}function mkey(d){return`${d.getFullYear()}-${pad(d.getMonth()+1)}`}
function buildTypes(){ $('types').innerHTML=TYPES.map(t=>`<label><input type="checkbox" value="${t}" checked> ${t}</label>`).join('')+'<div><button class="btn" id="all">Select all</button> <button class="btn" id="none">Clear</button></div>';$('types').querySelectorAll('input').forEach(x=>x.onchange=filter);$('all').onclick=()=>{$('types').querySelectorAll('input').forEach(x=>x.checked=true);filter()};$('none').onclick=()=>{$('types').querySelectorAll('input').forEach(x=>x.checked=false);filter()}}
function render(){ $('month').value=mkey(cur);$('title').textContent=mname(cur);let n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),h='';for(let i=1;i<=n;i++){let d=new Date(cur.getFullYear(),cur.getMonth(),i),r=rec(d),k=iso(d);h+=`<tr data-k="${k}" data-type="${r.type}" class="${[0,6].includes(d.getDay())?'week':''}"><td>${pad(i)}.${pad(cur.getMonth()+1)}.${cur.getFullYear()}</td><td>${d.toLocaleDateString('en-GB',{weekday:'short'})}</td><td><input type=time data-f=in value="${r.in}"></td><td><input type=time data-f=out value="${r.out}"></td><td><input type=number data-f=break value="${r.break}"></td><td class=sum>${hrs(r.in,r.out,r.break).toFixed(2)}</td><td class=prod><input type=number step=.25 data-f=prod value="${r.prod}"></td><td class=unprod><input type=number step=.25 data-f=unprod value="${r.unprod}"></td><td class=leave><input type=number step=.25 data-f=leave value="${r.leave}"></td><td><select data-f=type>${TYPES.map(t=>`<option ${t==r.type?'selected':''}>${t}</option>`).join('')}</select></td><td><input data-f=note value="${String(r.note).replace(/"/g,'&quot;')}"></td></tr>`}$('body').innerHTML=h;$('body').querySelectorAll('input,select').forEach(x=>x.oninput=e=>{let tr=e.target.closest('tr'),r=data[tr.dataset.k];r[e.target.dataset.f]=e.target.value;tr.dataset.type=r.type;tr.querySelector('.sum').textContent=hrs(r.in,r.out,r.break).toFixed(2);save();totals();drawCal();filter()});drawCal();totals();filter()}
function drawCal(){let y=cur.getFullYear(),m=cur.getMonth(),n=new Date(y,m+1,0).getDate(),off=(new Date(y,m,1).getDay()+6)%7,h='<div class=calhead>'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div>${x}</div>`).join('')+'</div><div class=calgrid>';for(let i=0;i<off;i++)h+='<button class="day blank"></button>';for(let i=1;i<=n;i++){let d=new Date(y,m,i),r=rec(d),k=iso(d),entered=r.in||r.out||r.prod||r.unprod||r.leave||r.note;h+=`<button class="day ${[0,6].includes(d.getDay())?'week':''} ${r.type.includes('Holiday')?'holiday':''}" data-k="${k}"><b>${i}</b>${entered?'<span class=dot></span>':''}</button>`}h+='</div>';$('cal').innerHTML=h;$('cal').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>edit(b.dataset.k))}
function edit(k){let d=new Date(k+'T12:00:00'),r=rec(d),e=$('editor');e.innerHTML=`<h3>${d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}</h3><div class=editgrid><div class=ef><label>In Time</label><input type=time data-f=in value="${r.in}"></div><div class=ef><label>Out Time</label><input type=time data-f=out value="${r.out}"></div><div class=ef><label>Break (min)</label><input type=number data-f=break value="${r.break}"></div><div class=ef><label>Total Time</label><div class=totalbox id=et>${hrs(r.in,r.out,r.break).toFixed(2)} h</div></div><div class=ef><label>Productive Hrs</label><input type=number step=.25 data-f=prod value="${r.prod}"></div><div class=ef><label>Unproductive Hrs</label><input type=number step=.25 data-f=unprod value="${r.unprod}"></div><div class=ef><label>Leave/Holiday Hrs</label><input type=number step=.25 data-f=leave value="${r.leave}"></div><div class=ef><label>Day Type</label><select data-f=type>${TYPES.map(t=>`<option ${t==r.type?'selected':''}>${t}</option>`).join('')}</select></div><div class="ef full"><label>Note</label><input data-f=note value="${String(r.note).replace(/"/g,'&quot;')}"></div></div><button class="btn primary" style="width:100%;margin-top:10px" id=done>Done</button>`;e.classList.add('open');e.querySelectorAll('[data-f]').forEach(x=>x.oninput=ev=>{r[ev.target.dataset.f]=ev.target.value;save();$('et').textContent=hrs(r.in,r.out,r.break).toFixed(2)+' h';totals();drawCal()});$('done').onclick=()=>{e.classList.remove('open');render()};e.scrollIntoView({behavior:'smooth'})}
function totals(){let n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),t=0,p=0,u=0,l=0;for(let i=1;i<=n;i++){let r=rec(new Date(cur.getFullYear(),cur.getMonth(),i));t+=hrs(r.in,r.out,r.break);p+=+r.prod||0;u+=+r.unprod||0;l+=+r.leave||0}$('st').textContent=t.toFixed(2)+' h';$('sp').textContent=p.toFixed(2)+' h';$('su').textContent=u.toFixed(2)+' h';$('sl').textContent=l.toFixed(2)+' h'}function filter(){let types=[...$('types').querySelectorAll('input:checked')].map(x=>x.value),sh=$('show').value,q=$('search').value.toLowerCase();$('body').querySelectorAll('tr').forEach(tr=>{let r=data[tr.dataset.k],entered=r.in||r.out||r.prod||r.unprod||r.leave||r.note,ok=types.includes(r.type)&&(sh=='all'||sh=='entered'&&entered||sh=='missing'&&!entered)&&(!q||tr.textContent.toLowerCase().includes(q)||String(r.note).toLowerCase().includes(q));tr.style.display=ok?'':'none'})}
for(let i=0;i<60;i++){let d=new Date(2026,8+i,1);$('month').add(new Option(mname(d),mkey(d)))}$('month').onchange=e=>{let[a,b]=e.target.value.split('-').map(Number);cur=new Date(a,b-1,1);render()};$('prev').onclick=()=>{if(cur>START){cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);render()}};$('next').onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);render()};$('show').onchange=filter;$('search').oninput=filter;$('typebtn').onclick=()=>$('types').classList.toggle('open');$('reset').onclick=()=>{$('show').value='all';$('search').value='';$('types').querySelectorAll('input').forEach(x=>x.checked=true);filter()};$('backup').onclick=()=>dl('timesheet-config.json',JSON.stringify({app:'Monthly Timesheet',version:3,data},null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let x=JSON.parse(r.result);data={...data,...(x.data||x)};save();render();alert('Configuration imported successfully')}catch{alert('Invalid configuration file')}};r.readAsText(f)};function dl(n,c,t){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([c],{type:t}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('csv').onclick=()=>{let rows=[['Date','Day','In','Out','Break','Total','Productive','Unproductive','Leave/Holiday','Day Type','Note']],n=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();for(let i=1;i<=n;i++){let d=new Date(cur.getFullYear(),cur.getMonth(),i),r=rec(d);rows.push([iso(d),d.toLocaleDateString('en-GB',{weekday:'long'}),r.in,r.out,r.break,hrs(r.in,r.out,r.break).toFixed(2),r.prod,r.unprod,r.leave,r.type,r.note])}dl('timesheet-'+mkey(cur)+'.csv',rows.map(a=>a.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')};buildTypes();render()})();
</script></body></html>
